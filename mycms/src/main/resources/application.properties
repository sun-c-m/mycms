spring.application.name=cms2

server.port=8081

# Local development uses dev by default; production sets SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/cms?useUnicode=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

#management.endpoints.web.exposure.include=beans,health

#logging.level.org.springframework.beans.factory.support=DEBUG
#logging.level.org.mybatis.spring.mapper=DEBUG
#logging.level.com.baomidou.mybatisplus=DEBUG

token.ttl.hours=168

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
