name: Deploy CMS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build backend
        working-directory: mycms
        run: |
          chmod +x mvnw
          ./mvnw clean package -Dmaven.test.skip=true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mycms-vue/package-lock.json

      - name: Prepare server directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            rm -rf /opt/cms/deploy/mycms /opt/cms/deploy/mycms-vue
            mkdir -p /opt/cms/deploy/mycms/target /opt/cms/deploy/mycms-vue/dist-admin /opt/cms/deploy/mycms-vue/dist-site

      - name: Build frontends
        working-directory: mycms-vue
        run: |
          npm ci
          VITE_BASE_PATH=/admin/ VITE_OUT_DIR=dist-admin npm run build-only
          VITE_BASE_PATH=/ VITE_OUT_DIR=dist-site npm run build-only

      - name: Upload backend jar
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "mycms/target/*.jar"
          target: "/opt/cms/deploy/mycms/target"

      - name: Upload admin frontend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "mycms-vue/dist-admin/*"
          target: "/opt/cms/deploy/mycms-vue/dist-admin"

      - name: Upload public portal
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "mycms-vue/dist-site/*"
          target: "/opt/cms/deploy/mycms-vue/dist-site"

      - name: Deploy and restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            mkdir -p /opt/cms/backend /opt/cms/admin/dist /opt/cms/college/dist
            jar_file="$(find /opt/cms/deploy/mycms -type f -name '*.jar' -print -quit)"
            test -n "$jar_file" || { echo 'backend jar not found'; exit 1; }
            cp "$jar_file" /opt/cms/backend/mycms.jar
            admin_index="$(find /opt/cms/deploy/mycms-vue -type f -path '*/dist-admin/index.html' -print -quit)"
            site_index="$(find /opt/cms/deploy/mycms-vue -type f -path '*/dist-site/index.html' -print -quit)"
            test -n "$admin_index" || { echo 'admin frontend index.html not found'; exit 1; }
            test -n "$site_index" || { echo 'public frontend index.html not found'; exit 1; }
            admin_build="$(dirname "$admin_index")"
            site_build="$(dirname "$site_index")"
            rm -rf /opt/cms/admin/dist/*
            cp -a "$admin_build"/. /opt/cms/admin/dist/
            rm -rf /opt/cms/college/dist/*
            cp -a "$site_build"/. /opt/cms/college/dist/
            test -f /opt/cms/admin/dist/index.html
            test -f /opt/cms/college/dist/index.html
            systemctl restart cms-backend
            systemctl reload nginx
